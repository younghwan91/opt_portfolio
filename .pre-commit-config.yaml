repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # .gitignore 는 `git add -f` 한 번이면 뚫린다. 초소형주 전략은 레시피가
      # 곧 종목이라, 한 번 푸시되면 히스토리·포크·캐시에 남아 되돌릴 수 없다.
      # 되돌릴 수 없는 실수는 경고가 아니라 차단으로 막는다.
      - id: no-private-strategy-configs
        name: 비공개 전략 설정이 커밋에 섞였는가
        entry: >-
          비공개 전략 설정은 커밋할 수 없다.
          운용 파라미터는 저장소 밖에 두고 `--config ~/data/strategy_live.json` 처럼 넘긴다.
        language: fail
        files: '(\.private\.json$|^configs/private/)'
