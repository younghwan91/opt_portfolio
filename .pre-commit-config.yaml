repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # .gitignore 는 `git add -f` 한 번이면 뚫린다. 초소형주 전략은 레시피가
      # 곧 종목이라, 한 번 푸시되면 히스토리·포크·캐시에 남아 되돌릴 수 없다.
      # 되돌릴 수 없는 실수는 경고가 아니라 차단으로 막는다.
      # 화이트리스트로 검사한다. 이름 규칙만 막으면 새 이름을 쓰는 순간 통과하고,
      # 실제로 그렇게 채택 전략 설정이 공개 상태로 쌓였다. configs/ 에 허용되는
      # 것은 스키마를 보여주는 합성 예제 둘뿐이다.
      #
      # `reports/` 도 같이 막는다 — 설정을 걷어내도 **리포트 본문이 같은
      # 파라미터를 서술한다.** 레시피가 사는 곳은 JSON 만이 아니다.
      - id: no-private-strategy-configs
        name: 비공개 전략 설정·리포트가 커밋에 섞였는가
        entry: >-
          비공개 전략 파라미터는 커밋할 수 없다. configs/ 에는 예제
          strategy.json · space.json 만 두고, 검증 리포트는 ~/data/reports/ 에 둔다.
          운용 파라미터는 `--config ~/data/configs/strategy_live.json` 처럼 넘긴다.
        language: fail
        files: '(\.private\.json$|^configs/private/|^configs/(?!strategy\.json$|space\.json$).*\.json$|^reports/)'
