name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 로컬 pre-commit 훅은 `git clone` 한 순간 사라진다 — 실제로 이 저장소가
  # 그렇게 잃었고, 비공개 전략 설정 차단 룰이 몇 달간 꺼진 채로 있었다.
  # 되돌릴 수 없는 실수를 막는 장치는 각자의 기계가 아니라 CI 에 둔다.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: pre-commit (전체 파일)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: ruff lint
        run: uv run ruff check src/ tests/ scripts/

      - name: ruff format check
        run: uv run ruff format --check src/ tests/ scripts/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --extra dev

      # 팩터 엔진은 엄격하게 막는다. CLAUDE.md 의 "신규 함수에는 타입 힌트가
      # 필수" 규칙이 실제로 강제되는 지점이다 (현재 이 트리는 mypy 무결점).
      - name: mypy (factor engine — 실패하면 CI 실패)
        run: uv run mypy src/opt_portfolio/factor/

      # 구 VAA 코드는 타입 힌트 없이 쓰였다(63건). 한 번에 고치는 것은 이
      # 작업의 범위가 아니라 보고만 한다 — 전체를 continue-on-error 로 덮으면
      # 신규 코드의 회귀까지 같이 숨는다.
      - name: mypy (legacy — 보고용)
        run: uv run mypy src/
        continue-on-error: true

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/opt_portfolio --cov-report=xml --cov-report=html --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
